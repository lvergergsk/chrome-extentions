<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utils</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__brand">
          <img class="popup__logo" src="icons/32.png" alt="" width="32" height="32" aria-hidden="true">
          <div>
            <h1>Utils</h1>
            <p class="popup__version">v<span id="version"></span></p>
          </div>
        </div>
        <div id="overallStatus" class="status-chip" data-tone="loading" role="status" aria-live="polite" aria-atomic="true">
          <span class="status-chip__dot" aria-hidden="true"></span>
          <span id="statusChip">正在读取</span>
        </div>
      </header>

      <section class="card checkin" aria-labelledby="checkinTitle">
        <div class="checkin__header">
          <span class="feature-icon" aria-hidden="true">H</span>
          <div class="checkin__heading">
            <h2 id="checkinTitle">HoYoLAB 自动签到</h2>
            <p id="scheduleText">每天 09:10 / 15:10 自动检查</p>
          </div>
          <label class="toggle" for="autoCheckin">
            <span class="sr-only">启用 HoYoLAB 自动签到</span>
            <input id="autoCheckin" type="checkbox" role="switch" aria-describedby="scheduleText" disabled>
            <span class="toggle__track" aria-hidden="true"></span>
          </label>
        </div>

        <div class="checkin__divider" aria-hidden="true"></div>

        <div id="checkinSummary" class="checkin__summary" aria-busy="true">
          <span class="checkin__indicator" aria-hidden="true"></span>
          <div>
            <h3 id="checkinStatus">正在读取状态…</h3>
            <p id="checkinDetail">请稍候</p>
          </div>
        </div>

        <dl class="metrics">
          <div class="metric">
            <dt>上次检查</dt>
            <dd id="lastCheckin">尚无记录</dd>
          </div>
          <div class="metric">
            <dt>下次检查</dt>
            <dd id="nextCheckin">等待计划</dd>
          </div>
        </dl>

        <div class="checkin__divider" aria-hidden="true"></div>

        <div class="checkin__header">
          <span class="feature-icon" aria-hidden="true">C</span>
          <div class="checkin__heading">
            <h2 id="redeemTitle">兑换码自动兑换</h2>
            <p id="redeemDetail">正在读取状态…</p>
          </div>
          <label class="toggle" for="autoRedeem">
            <span class="sr-only">启用兑换码自动兑换</span>
            <input id="autoRedeem" type="checkbox" role="switch" aria-describedby="redeemDetail" disabled>
            <span class="toggle__track" aria-hidden="true"></span>
          </label>
        </div>

        <button id="checkinButton" class="button button--primary" type="button" disabled>正在读取…</button>
      </section>

      <section class="card tools" aria-labelledby="toolsTitle">
        <div class="tools__header">
          <h2 id="toolsTitle">其他工具</h2>
          <span>常驻开启</span>
        </div>
        <ul class="tools__list">
          <li>
            <span class="tool-icon" aria-hidden="true">X</span>
            <span><strong>X 媒体</strong><small>下载图片与视频</small></span>
            <span class="tool-status"><span class="sr-only">运行正常</span></span>
          </li>
          <li>
            <span class="tool-icon" aria-hidden="true">P</span>
            <span><strong>pixiv</strong><small>原图下载并自动收藏</small></span>
            <span class="tool-status"><span class="sr-only">运行正常</span></span>
          </li>
          <li>
            <span class="tool-icon" aria-hidden="true">W</span>
            <span><strong>网页清理</strong><small>广告拦截与页面清理</small></span>
            <span class="tool-status"><span class="sr-only">运行正常</span></span>
          </li>
        </ul>
      </section>

      <button id="reloadButton" class="button button--secondary" type="button">重新加载扩展</button>
      <p class="popup__privacy">本地运行 · 不保存账号信息</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
